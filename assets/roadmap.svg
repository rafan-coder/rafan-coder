<text x="254" y="149" text-anchor="middle" font-size="13" fill="#c9d1d9">Switching</text>
<circle cx="418" cy="90" r="16" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
<path d="M411 90 l5 6 l10 -12" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="418" y="132" text-anchor="middle" font-size="13" fill="#c9d1d9">Routing and</text>
<text x="418" y="149" text-anchor="middle" font-size="13" fill="#c9d1d9">NOC Monitoring</text>
<circle cx="582" cy="90" r="16" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
