<text x="582" y="132" text-anchor="middle" font-size="13" fill="#c9d1d9">Cisco Networking</text>
<text x="582" y="149" text-anchor="middle" font-size="13" fill="#c9d1d9">Basics Certificate</text>
<circle cx="746" cy="90" r="16" fill="#0d1117" stroke="#00e5ff" stroke-width="3" filter="url(#glow)"><animate attributeName="r" values="14;19;14" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="746" cy="90" r="5" fill="#00e5ff"/>
<text x="746" y="132" text-anchor="middle" font-size="13" fill="#7ee7ff">Cloud Networking</text>
<text x="746" y="149" text-anchor="middle" font-size="13" fill="#7ee7ff">VPC / VNet</text>
