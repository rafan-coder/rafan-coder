<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1b2b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="200" rx="16" fill="url(#bg)"/>
  <text x="24" y="30" font-size="14" fill="#58a6ff" font-family="Consolas, Courier New, monospace">$ roadmap --on-prem-to-cloud</text>
<line x1="90" y1="90" x2="910" y2="90" stroke="#30363d" stroke-width="3" stroke-dasharray="4 6"/>
