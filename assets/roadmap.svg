<circle r="5" fill="#00e5ff" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" path="M90 90 L746 90"/></circle>
<circle cx="90" cy="90" r="16" fill="#0d1117" stroke="#3fb950" stroke-width="3"/>
<path d="M83 90 l5 6 l10 -12" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="132" text-anchor="middle" font-size="13" fill="#c9d1d9">TCP/IP and</text>
<text x="90" y="149" text-anchor="middle" font-size="13" fill="#c9d1d9">Subnetting</text>
