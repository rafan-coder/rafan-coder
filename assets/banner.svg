<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b2a4a"/>
    </linearGradient>
    <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7ee7ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="260" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <!-- decorative network nodes -->
    <g stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M50 45 L110 80 L70 150 L150 125 L110 80"/>
      <path d="M950 45 L890 80 L930 150 L850 125 L890 80"/>
    </g>
    <g fill="#00e5ff">
      <circle cx="50" cy="45" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="110" cy="80" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="150" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="125" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="45" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="890" cy="80" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="150" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="125" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>
    <!-- packets -->
    <circle r="3.5" fill="#3fb950"><animateMotion dur="3s" repeatCount="indefinite" path="M50 45 L110 80 L70 150 L150 125"/></circle>
    <circle r="3.5" fill="#ff9f1c"><animateMotion dur="3.4s" repeatCount="indefinite" path="M950 45 L890 80 L930 150 L850 125"/></circle>

    <!-- text -->
    <g>
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <text x="500" y="108" text-anchor="middle" font-size="68" font-weight="700" fill="url(#nm)">Rafan A</text>
      <text x="500" y="150" text-anchor="middle" font-size="22" fill="#7ee7ff">Junior Network Engineer  |  NOC Engineer  |  Cloud Networking</text>
      <text x="500" y="180" text-anchor="middle" font-size="15" fill="#8b949e">Dubai, UAE  •  Available Immediately</text>
    </g>

    <!-- waves -->
    <path d="M0 228 q125 -22 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 L2000 300 L0 300 Z" fill="#1f6feb" fill-opacity="0.35">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M0 238 q125 -16 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 L2000 300 L0 300 Z" fill="#00e5ff" fill-opacity="0.25">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 248 q125 -10 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 L2000 300 L0 300 Z" fill="#0d1117" fill-opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
