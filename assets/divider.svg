<svg viewBox="0 0 1000 10" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="1000" height="2" rx="1" fill="#1f6feb" fill-opacity="0.35"/>
  <rect x="-250" y="3" width="250" height="4" rx="2" fill="url(#g)">
    <animate attributeName="x" from="-250" to="1000" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
