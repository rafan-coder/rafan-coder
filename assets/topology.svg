<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1b2b"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1f6feb" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .link { stroke:#00e5ff; stroke-opacity:.45; stroke-width:2; fill:none; stroke-dasharray:6 6; animation: dash 1.2s linear infinite; }
      .v20 { stroke:#ff9f1c; }
      @keyframes dash { to { stroke-dashoffset:-24; } }
      .node { fill:#0d1117; stroke:#00e5ff; stroke-width:2; }
      .node2 { fill:#0d1117; stroke:#3fb950; stroke-width:2; }
      .node3 { fill:#0d1117; stroke:#ff9f1c; stroke-width:2; }
      .lbl { fill:#c9d1d9; font-size:12px; text-anchor:middle; }
      .tag { fill:#00e5ff; font-size:11px; text-anchor:middle; }
      .title { fill:#58a6ff; font-size:14px; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
      @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      .blink { animation: blink 1.6s steps(2,start) infinite; }
      @keyframes blink { 50% { opacity:0; } }
    </style>
  </defs>

  <rect width="900" height="340" rx="14" fill="url(#bg)"/>
  <rect width="900" height="340" rx="14" fill="url(#grid)"/>

  <text x="24" y="30" class="title">$ show topology --live<tspan class="blink"> _</tspan></text>

  <!-- Links -->
  <path class="link" d="M450 78 L450 128"/>
  <path class="link" d="M450 168 L300 218"/>
  <path class="link v20" d="M450 168 L600 218"/>
  <path class="link" d="M300 252 L200 290"/>
  <path class="link" d="M300 252 L400 290"/>
  <path class="link v20" d="M600 252 L500 290"/>
  <path class="link v20" d="M600 252 L700 290"/>

  <!-- Cloud -->
  <g class="pulse" filter="url(#glow)">
    <path d="M410 70 q-22 0 -22 -18 q0 -16 18 -17 q6 -20 30 -18 q22 2 26 20 q22 2 22 17 q0 16 -20 16 z" class="node"/>
  </g>
  <text x="450" y="58" class="tag">CLOUD / WAN</text>

  <!-- Router -->
  <g filter="url(#glow)">
    <rect x="400" y="128" width="100" height="40" rx="8" class="node"/>
  </g>
  <text x="450" y="146" class="lbl">R1</text>
  <text x="450" y="161" class="tag">Cisco 2911</text>

  <!-- Switches -->
  <rect x="250" y="218" width="100" height="34" rx="8" class="node2"/>
  <text x="300" y="234" class="lbl">SW1 · 2960</text>
  <text x="300" y="247" class="tag">VLAN 10</text>

  <rect x="550" y="218" width="100" height="34" rx="8" class="node3"/>
  <text x="600" y="234" class="lbl">SW2 · 2960</text>
  <text x="600" y="247" class="tag" style="fill:#ff9f1c">VLAN 20</text>

  <!-- Endpoints -->
  <rect x="160" y="290" width="80" height="30" rx="6" class="node2"/>
  <text x="200" y="309" class="lbl">PC-A</text>
  <rect x="360" y="290" width="80" height="30" rx="6" class="node2"/>
  <text x="400" y="309" class="lbl">PC-B</text>
  <rect x="460" y="290" width="80" height="30" rx="6" class="node3"/>
  <text x="500" y="309" class="lbl">SRV-01</text>
  <rect x="660" y="290" width="80" height="30" rx="6" class="node3"/>
  <text x="700" y="309" class="lbl">PC-C</text>

  <!-- Packets -->
  <g filter="url(#glow)">
    <circle r="4.5" fill="#00e5ff">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M450 78 L450 128 L300 218 L200 290"/>
    </circle>
    <circle r="4.5" fill="#3fb950">
      <animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" path="M400 290 L300 252 L450 168 L450 78"/>
    </circle>
    <circle r="4.5" fill="#ff9f1c">
      <animateMotion dur="2.6s" begin="0.3s" repeatCount="indefinite" path="M450 78 L450 128 L600 218 L500 290"/>
    </circle>
    <circle r="4.5" fill="#ff9f1c">
      <animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M700 290 L600 252 L450 168 L450 78"/>
    </circle>
  </g>

  <text x="876" y="30" class="tag" text-anchor="end" style="text-anchor:end">● packets flowing</text>
</svg>
